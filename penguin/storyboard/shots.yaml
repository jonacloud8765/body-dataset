# THE PENGUIN: shot list
#
# One entry per shot. `at` is where the shot starts, as bar.beat on the measured song
# (penguin/analysis/song-map.json); "0s" or "139.0s" are absolute seconds (used for the first
# frame and for the silent epilogue after the song ends). A shot runs until the next shot's `at`.
# `end` closes the final shot. Sung lyrics are filled in by build.py from the song map.
#
# Fields
#   mode        CINEMA (his film, 2.39:1) | DOC (the documentary, 16:9 + viewfinder) | MAP | FULL (open frame)
#   intensity   1-5, from the measured arrangement (1 voice+pad ... 5 the instrumental climax)
#   view/head   body view and the model-sheet head used (frown, sideeye, smirk, annoyed,
#               profile, laugh, sad, surprised, angry); `sing: true` = lip sync on
#   stage       the mountain's stage (M0-M6, doc §7)
#   tod         time of day / weather preset
#   beats       events inside the shot, in musical time (bar.beat) or seconds
#   out         the transition out of this shot into the next

- id: S01
  at: "0s"
  title: The map
  section: intro
  mode: MAP
  intensity: 1
  music: Keys and voice alone. No drums.
  visual: >-
    A blank sheet of paper. The documentary's tracking map inks itself on: coastline, contour
    lines, a grid, a cluster of dots labelled THE COLONY at far left, and at far right a small ink
    peak marker (a dome with a jutting spur) labelled MOUNTAINS. A dotted measuring line crawls from the colony to the marker.
  action: None. The penguin is a single dot in the colony cluster, the only dot facing the other way.
  framing: Full-frame graphic, top-down
  move: Locked, with a slow drift toward the marker (zoom 1.00 to 1.04)
  environment: The tracking map (E13)
  light: None; flat paper
  color: Paper, ink, grey contour lines. No wash.
  animation: >-
    Lines draw on as ink strokes (stroke-dashoffset) with a slight wobble. The dotted line advances
    one dot per eighth note. `70 KM` stamps down on "-meters" with a 2-frame squash.
  fx: Paper grain; a faint ink bleed on the stamp
  out: REC pop. The UI blinks on and the image cuts to the camera's live view.
  purpose: State the stakes (the distance) before the story starts
  view: none
  head: none
  sing: false
  stage: M0
  tod: paper
  beats:
    - {at: "1.1", do: "coastline and contours ink on"}
    - {at: "1.3", do: "measuring line starts at the colony"}
    - {at: "2.2", do: "70 KM stamps beside the line"}

- id: S02
  at: "2.3.5"
  title: The colony
  section: intro
  mode: DOC
  intensity: 1
  music: Voice and keys
  visual: >-
    The documentary's first live shot, telephoto from a low rise: hundreds of penguins packed on a
    trampled shore, every one facing the sea at screen left. We see a field of black backs. In the
    middle of it, one white front faces the camera: him, facing inland.
  action: He stands still, looking past the camera, inland. Everyone else looks at the sea.
  framing: Telephoto wide; the colony fills the lower two thirds; the dark sea strip at the top
  move: Handheld drift; exposure settles from white in 10 frames
  environment: The colony (E07), pre-dawn
  light: Flat pre-dawn; no shadows
  color: Paper with a cold blue-grey wash; the DOC grade on top
  animation: Colony crowd idles (seeded shuffles); the sea's ice floes drift
  fx: Viewfinder UI (REC, TC, battery), video noise, vignette
  out: Cut on the beat to the tighter DOC shot
  purpose: The outsider image. One face in a crowd of backs.
  view: front
  head: frown
  sing: false
  stage: M0
  tod: predawn
  beats:
    - {at: "2.3.5", do: "power-on: black, REC dot, UI elements pop in one per 2 frames"}

- id: S03
  at: "3.3"
  title: Heads turn
  section: intro
  mode: DOC
  intensity: 1
  music: The quiet, high background vocal echo; keys
  visual: >-
    Tighter telephoto. The focus brackets hunt across the crowd, overshoot, come back and lock on
    him. Snap zoom. As the background voices echo, the penguins around him turn their heads to
    look at him in a slow wave that ripples outward.
  action: >-
    He doesn't look back at them. His eyes stay on the horizon beyond the camera. One slow blink.
  framing: Telephoto medium-wide, him centered in the brackets with a ring of neighbors
  move: Handheld; snap zoom 1.0 to 1.6 with overshoot at 4.1
  environment: The colony (E07)
  light: Pre-dawn
  color: Blue-grey wash, DOC grade
  animation: The head-turn wave (each neighbor 2 frames after the last, rippling outward)
  fx: Focus-hunt blur pulses; lower third types on
  out: Letterbox slam on "Se-" of the second "Seventy". The UI blinks off.
  purpose: '"They" are the colony. Social pressure, shown as a gag.'
  view: front
  head: frown
  sing: false
  stage: M0
  tod: predawn
  lower_third: ["THE COLONY · DAY 1", "SUBJECT 01"]
  beats:
    - {at: "3.3", do: "brackets start hunting"}
    - {at: "4.1", do: "snap zoom and lock on him"}
    - {at: "4.1", do: "head-turn wave begins, 2 frames per penguin"}
    - {at: "4.3", do: "lower third types on"}

